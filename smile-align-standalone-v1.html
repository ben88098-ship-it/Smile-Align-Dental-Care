e>Smile Align Stock</title>
<style>
:root{--bg:#fff;--fg:#14284B;--mut:#5b6b85;--tl:#0F8B8D;--gd:#B8892B;--ln:#dfe6ef;--cd:#f4f8fb;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1830;--fg:#e8eef8;--mut:#9fb0c9;--tl:#3cc0c2;--gd:#e0bb62;--ln:#24365a;--cd:#14233f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1830;--fg:#e8eef8;--mut:#9fb0c9;--tl:#3cc0c2;--gd:#e0bb62;--ln:#24365a;--cd:#14233f;--bad:#ff8a80}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 4px;max-width:560px;margin:auto}header h1{margin:0;font-size:20px}header p{margin:0;color:var(--mut);font-size:13px}
main{padding:8px 16px 96px;max-width:560px;margin:auto}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:12px 0}
h2{font-size:16px;margin:0 0 8px}
.mut{color:var(--mut);font-size:14px;margin:4px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.k{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mut)}
.k b{display:block;font-size:30px;line-height:1.1;color:var(--fg)}.k.g2 b{color:var(--gd)}.k.w b{color:var(--bad)}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;margin:5px 0}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;border-radius:10px;border:1px solid var(--tl);background:transparent;color:var(--tl);padding:10px 14px;margin:4px 4px 4px 0}
button.pri{background:var(--tl);color:#fff;width:100%;margin:8px 0 0}
button.m{padding:16px 8px;margin:0;font-weight:700}button.m.on{background:var(--tl);color:#fff}button.m.out.on{background:var(--gd);border-color:var(--gd)}
button.x{border-color:var(--bad);color:var(--bad)}
.bad{color:var(--bad)}.warn{color:var(--gd)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;margin:0;padding:13px 2px;color:var(--mut);font-size:14px}nav button.on{color:var(--tl);font-weight:700;box-shadow:inset 0 3px 0 var(--gd)}
#t{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
</style></head><body>
<header><h1>Smile Align Stock</h1><p id="st">Naxalbari dental clinic</p></header>
<main id="v"></main><div id="t"></div>
<nav><button data-v="home" onclick="go('home')">Home</button><button data-v="prod" onclick="go('prod')">Products</button><button data-v="stock" onclick="go('stock')">Stock</button><button data-v="bak" onclick="go('bak')">Backup</button></nav>
<script>
const K='sadc_simple_v2';let D=null;
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D){D={p:[],h:[],saved:0};try{const o=JSON.parse(localStorage.getItem('sadc_stock_v1'));if(o&&o.p)o.p.forEach(p=>{D.p.push({id:p.id,name:p.name,u:p.u,min:p.min,q:o.b.filter(b=>b.pid==p.id).reduce((s,b)=>s+b.q,0)})})}catch(e){}}
let DBR=null,BKR=null,BT=0,RA=false,busy=false,dirty=false;
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d+' days ago'};
async function writeBak(){if(!BKR||!D.p.length)return false;try{const d=JSON.parse(JSON.stringify(D));d.h=d.h.slice(-200);await BKR.set({d:d,t:Date.now()});BT=Date.now();return true}catch(e){return false}}
async function backupNow(){if(!D.p.length)return toast('Nothing to back up yet');toast(await writeBak()?'Backed up':'Backup failed');render()}
async function restoreAuto(){if(!RA){RA=true;render();return}try{const s=await BKR.get();const x=s.exists&&s.data().d;if(!x||!x.p)throw 0;D=JSON.parse(JSON.stringify(x));RA=false;save();toast('Restored');go('home')}catch(e){RA=false;toast('No automatic backup found');render()}}
const setSt=t=>{const e=$('#st');if(e)e.textContent=t};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}push()};
async function push(){if(!DBR)return;if(busy){dirty=true;return}busy=true;
 try{const d=JSON.parse(JSON.stringify(D));d.h=d.h.slice(-200);await DBR.set({d:d,u:Date.now()});setSt('Saved to your Claude account')}catch(e){setSt('Not saved online, only on this phone')}
 busy=false;if(dirty){dirty=false;push()}}
async function boot(){
 setSt('Saved on this phone. Back up weekly.');
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 try{if('serviceWorker'in navigator){await navigator.serviceWorker.register('sw-v1.js');const c=await caches.open('sadc-app');await c.add(location.href.split('#')[0])}}catch(e){}
 render()}
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const num=n=>+(+n).toFixed(2);
let Q='',SF='';const filt=a=>a.filter(p=>p.name.toLowerCase().includes(Q.trim().toLowerCase()));
let V='home',M='in',CF=null,ED=null,RC=false;
function toast(t){const e=$('#t');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2600)}
function go(v){V=v;Q='';SF='';RA=false;CF=null;ED=null;RC=false;render()}
const rows=(a,f)=>a.length?a.map(x=>'<div class="row">'+f(x)+'</div>').join(''):'<p class="mut">None</p>';
const line=(p,c)=>`<span>${esc(p.name)}</span><b class="${c||''}">${p.q} ${esc(p.u)}</b>`;
const opts=()=>'<option value="">Select product</option>'+D.p.filter(p=>p.name.toLowerCase().includes(SF.trim().toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.q} ${esc(p.u)})</option>`).join('');
const homeList=()=>rows(filt(D.p.slice()).sort((a,b)=>a.q-b.q),p=>line(p,p.q<=0?'bad':p.q<=p.min?'warn':''));
const prodList=()=>rows(filt(D.p.slice()).sort((a,b)=>a.name.localeCompare(b.name)),p=>ED===p.id?`<div style="width:100%"><input id="en" value="${esc(p.name)}"><div class="r"><input id="eu" value="${esc(p.u)}"><input id="em" type="number" inputmode="decimal" value="${p.min}"></div><button onclick="saveE('${p.id}')">Save</button><button onclick="ED=null;render()">Cancel</button></div>`:`<span>${esc(p.name)}<br><span class="mut">Warn at ${p.min} ${esc(p.u)}</span></span><span><button onclick="ED='${p.id}';render()">Edit</button><button class="x" onclick="delP('${p.id}')">${CF===p.id?'Tap to confirm':'Remove'}</button></span>`);
const VIEWS={
home(){
 const out=D.p.filter(p=>p.q<=0),low=D.p.filter(p=>p.q>0&&p.q<=p.min),ok=D.p.filter(p=>p.q>0);
 const age=D.saved?Math.floor((Date.now()-D.saved)/864e5):null;
 return (!DBR&&(age===null||age>=7)?`<section class="c"><h2>Time to back up</h2><p class="mut">${age===null?'No backup yet.':'Last backup was '+age+' days ago.'} Your records are stored only on this phone.</p><button class="pri" onclick="go('bak')">Open backup</button></section>`:'')+
 `<div class="g"><div class="k">Products<b>${D.p.length}</b></div><div class="k">In stock<b>${ok.length}</b></div><div class="k g2">About to finish<b>${low.length}</b></div><div class="k w">Out of stock<b>${out.length}</b></div></div>`+
 (D.p.length?'':`<section class="c"><h2>Start here</h2><p class="mut">Add your materials on the Products page first.</p></section>`)+
 `<section class="c"><h2>About to finish</h2>${rows(low,p=>line(p,'warn'))}</section><section class="c"><h2>Out of stock</h2>${rows(out,p=>`<span>${esc(p.name)}</span><b class="bad">0</b>`)}</section><section class="c"><h2>Remaining stock</h2><input id="q" placeholder="Search products" oninput="Q=this.value;$('#lst').innerHTML=homeList()"><div id="lst">${homeList()}</div></section>`},
prod(){return `<section class="c"><h2>Add a material</h2><input id="pn" placeholder="Name, e.g. Composite A2"><div class="r"><input id="pu" placeholder="Unit (pcs, box, ml)"><input id="pq" type="number" inputmode="decimal" placeholder="Stock now"></div><input id="pm" type="number" inputmode="decimal" placeholder="Warn me when stock is this or less"><button class="pri" onclick="addP()">Add to list</button></section><section class="c"><h2>Your materials (${D.p.length})</h2><input id="q" placeholder="Search products" oninput="Q=this.value;$('#lst').innerHTML=prodList()"><div id="lst">${prodList()}</div></section>`},
stock(){return `<div class="r" style="margin-top:12px"><button class="m ${M==='in'?'on':''}" onclick="M='in';render()">Bought<br>add stock</button><button class="m out ${M==='out'?'on':''}" onclick="M='out';render()">Used<br>reduce stock</button></div><section class="c"><h2>${M==='in'?'Add bought stock':'Record used stock'}</h2><input id="sf" placeholder="Search product" oninput="SF=this.value;$('#sp').innerHTML=opts()"><select id="sp">${opts()}</select><input id="sq" type="number" inputmode="decimal" placeholder="Quantity"><input id="sn" placeholder="Note (optional)"><button class="pri" onclick="doStock()">${M==='in'?'Add stock':'Record use'}</button>${D.p.length?'':'<p class="mut">Add materials on the Products page first.</p>'}</section><section class="c"><h2>Recent activity</h2>${rows(D.h.slice(-30).reverse(),h=>`<span>${esc(h.name)}<br><span class="mut">${h.t.slice(0,16).replace('T',' ')}${h.note?', '+esc(h.note):''}</span></span><b class="${h.type==='OUT'?'warn':''}">${h.type==='OUT'?'-':'+'}${h.q}</b>`)}</section>`},
bak(){const age=D.saved?Math.floor((Date.now()-D.saved)/864e5)+' days ago':'never';
 return `<section class="c"><h2>Back up</h2><p class="mut">Last file backup: ${age}.</p><button onclick="expB()">Save backup file</button><button onclick="copyB()">Copy backup text</button></section><section class="c"><h2>Restore</h2><textarea id="rb" rows="4" placeholder="Paste backup text here"></textarea><button class="${RC?'x':''}" onclick="restore()">${RC?'Tap to confirm replace':'Restore from text'}</button></section>`}};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V));$('#v').innerHTML=VIEWS[V]();scrollTo(0,0)}
function addP(){const n=$('#pn').value.trim();if(!n)return toast('Enter a name');
 const p={id:uid(),name:n,u:$('#pu').value.trim()||'pcs',min:num($('#pm').value||0),q:num($('#pq').value||0)};
 D.p.push(p);if(p.q>0)D.h.push({t:new Date().toISOString(),pid:p.id,name:p.name,type:'IN',q:p.q,note:'Opening stock'});
 save();toast('Added');render()}
function saveE(id){const p=D.p.find(x=>x.id==id),n=$('#en').value.trim();if(!n)return toast('Name cannot be empty');p.name=n;p.u=$('#eu').value.trim()||'pcs';p.min=num($('#em').value||0);ED=null;save();render()}
function delP(id){if(CF!==id){CF=id;render();return}D.p=D.p.filter(x=>x.id!=id);CF=null;save();render()}
function doStock(){const p=D.p.find(x=>x.id==$('#sp').value),q=num($('#sq').value);
 if(!p||!(q>0))return toast('Choose a product and quantity');
 if(M==='out'&&q>p.q)return toast('Only '+p.q+' '+p.u+' in stock');
 p.q=num(p.q+(M==='in'?q:-q));
 D.h.push({t:new Date().toISOString(),pid:p.id,name:p.name,type:M==='in'?'IN':'OUT',q,note:$('#sn').value.trim()});
 save();render();toast(p.name+': now '+p.q+' '+p.u)}
async function expB(){const n='smile-align-stock-backup-'+today()+'.json',f=new File([JSON.stringify(D)],n,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;document.body.appendChild(a);a.click();a.remove()}
  D.saved=Date.now();save();toast('Backup saved');render()}catch(e){if(e&&e.name==='AbortError')return;toast('Could not save a file. Use Copy backup text.')}}
async function copyB(){try{await navigator.clipboard.writeText(JSON.stringify(D));D.saved=Date.now();save();toast('Copied. Paste it into Notes');render()}catch(e){toast('Copy failed on this device')}}
function restore(){let x;try{x=JSON.parse($('#rb').value);if(!x.p||!x.h)throw 0}catch(e){return toast('That backup text is not valid')}
 if(!RC){RC=true;render();return}D=x;save();toast('Restored');go('home')}
boot();
</script></body></html>
